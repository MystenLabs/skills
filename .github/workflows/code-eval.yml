name: Code Evals

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "**/*.md"
      - "**/evals/code-evals.json"
      - "scripts/run-code-evals.js"
      - "scripts/lib/**"
  workflow_dispatch:
    inputs:
      skill:
        description: "Run code evals for a specific skill (leave empty for all)"
        required: false
        type: string
  schedule:
    # Weekly Monday 7am UTC (offset from text evals at 6am)
    - cron: "0 7 * * 1"

jobs:
  code-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Sui CLI
        run: |
          curl -fsSL https://sui.io/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Sui CLI
        run: sui --version

      - name: Install dependencies
        run: npm ci

      - name: Run code evals (PR — changed skills only)
        if: github.event_name == 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/run-code-evals.js --changed-only

      - name: Run code evals (scheduled — all skills)
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/run-code-evals.js

      - name: Run code evals (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.skill }}" ]; then
            node scripts/run-code-evals.js --skill "${{ inputs.skill }}"
          else
            node scripts/run-code-evals.js
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-eval-results
          path: scripts/code-eval-results.json

      - name: Comment on PR with failures
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'scripts/code-eval-results.json';
            if (!fs.existsSync(resultsPath)) return;

            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf-8'));
            const failures = results.filter(r => r.status !== 'PASS');
            if (failures.length === 0) return;

            let body = '## Code Eval Failures\n\n';
            for (const f of failures) {
              body += `### ${f.skill} / ${f.eval_id} — ${f.status}\n`;
              if (f.build && !f.build.pass) {
                body += `- Build: ${f.build.detail.slice(0, 300)}\n`;
              }
              if (f.test && !f.test.pass) {
                body += `- Test: ${f.test.detail.slice(0, 300)}\n`;
              }
              if (f.error) body += `- Error: ${f.error}\n`;
              body += '\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
